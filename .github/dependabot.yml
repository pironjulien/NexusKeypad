# Dependabot: weekly updates of the pinned GitHub Actions (SHA + version comment) and of the NuGet references.
# A 7-day cooldown lets a compromised release be caught before it is proposed (zizmor dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # No project or solution at the root: scan each folder that declares NuGet dependencies, including the native
  # helper and isolated test projects. Shared LogiPluginApi and Tomlyn updates are grouped in one PR.
  - package-ecosystem: nuget
    directories:
      - /plugin/src
      - /apercu
      - /verifier
      - /hook
      - /tests/connecteurs
      - /tests/hook-son
      - /tests/claude-quota
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
