# Dependabot: weekly updates of the pinned GitHub Actions (SHA + version comment) and of the NuGet references.
# A 7-day cooldown lets a compromised release be caught before it is proposed (zizmor dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # No project or solution at the root: the NuGet updater reads the folders that hold the .csproj files (hook.csproj
  # has no NuGet reference). The same LogiPluginApi version in the three projects is proposed in a single grouped PR.
  - package-ecosystem: nuget
    directories:
      - /plugin/src
      - /apercu
      - /verifier
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
