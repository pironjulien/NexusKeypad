# Dependabot: weekly updates of the pinned GitHub Actions (SHA + version comment) and of the NuGet references.
# A 7-day cooldown lets a compromised release be caught before it is proposed (zizmor dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # Scan each folder that declares NuGet dependencies, including the native helper and the test projects (xunit.v3 in
  # tests/Directory.Build.props). Shared LogiPluginApi and Tomlyn updates are grouped in one PR.
  - package-ecosystem: nuget
    directories:
      - /plugin/src
      - /apercu
      - /hook
      - /tests
      - /tests/Connecteurs
      - /tests/Hook
      - /tests/Isole
      - /tests/Logique
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
