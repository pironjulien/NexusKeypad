# CodeQL (https://codeql.github.com): code scanning of the C# sources and of the workflows, free on a public repository.
# C# is built for real (build-mode manual) on Windows, like tests.yml: without the Logi service on the runner, the
# project compiles against the LogiPluginApi package published by Logitech on NuGet, so no proprietary SDK is needed.
# Actions pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
            os: windows-latest
          - language: actions
            build-mode: none
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the plugin (with its native hook), the preview and the rule checker
        if: matrix.build-mode == 'manual'
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet build plugin/src/TrinitePadPlugin.csproj -c Debug -nologo -p:NexusTest=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build apercu/apercu.csproj -c Debug -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build verifier/verifier.csproj -c Debug -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: /language:${{ matrix.language }}
