# Release, in two channels, with the shared Nexus release workflows of NexusSystem.
# - Development: every push to main checks one version everywhere, runs test.ps1 and builds the three Logi Marketplace
#   editions and the complete NexusKeypad edition installed by get.ps1 (.lplug4, checked by the official Logi Plugin
#   Tool), plus get.ps1 and SHA256SUMS.txt. product-dev-release attests them (verify with `gh attestation verify <file>
#   --repo pironjulien/NexusKeypad`; the Sigstore bundle is attached as NexusKeypad-X.Y.Z.intoto.jsonl) and publishes
#   the pre-release vX.Y.Z-dev.N (NexusSystem's development channel).
# - Stable: right after that build when its version is not released yet, or "Run workflow" (promote: a vX.Y.Z-dev.N,
#   or empty for the newest), product-promote runs: the SAME files become the release vX.Y.Z with the CHANGELOG
#   section. get.ps1 installs from releases/latest, never a pre-release. NexusKeypad is not in the MCP registry.
# Actions and shared workflows pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Development build to publish as stable (vX.Y.Z-dev.N; empty = the newest)
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: One version everywhere
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content plugin/src/TrinitePadPlugin.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "plugin/src/TrinitePadPlugin.csproj: no X.Y.Z version ($version)." }
          $found = [ordered]@{}
          foreach ($package in 'package', 'package-poste', 'package-complete', 'package-nexus') {
            $yaml = "plugin/src/$package/metadata/LoupedeckPackage.yaml"
            $found[$yaml] = (Get-Content $yaml | Select-String '^version:\s*(\S+)').Matches[0].Groups[1].Value
          }
          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $version } | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($wrong) { throw "Version $version expected: $($wrong -join ', ')" }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) { throw "CHANGELOG.md has no [$version] section." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Packages
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet tool install -g LogiPluginTool --version 6.4.2.3599
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = $env:VERSION
          foreach ($e in 'Marketplace', 'Poste', 'Complete', 'Nexus') { ./outils/paquet_marketplace.ps1 -Edition $e }
          New-Item -ItemType Directory dist | Out-Null
          $suffixe = $version -replace '\.', '_'
          $fichiers = @(Get-ChildItem "$HOME\.nexus\build\nexuskeypad\marketplace" -File -Filter "*_$suffixe.lplug4")
          if ($fichiers.Count -ne 4) { throw "Expected 4 packages at version $version, got $($fichiers.Count)." }
          $paquetComplet = @($fichiers | Where-Object { $_.Name -eq "NexusKeypad_$suffixe.lplug4" })
          if ($paquetComplet.Count -ne 1) { throw 'Complete NexusKeypad package is absent.' }
          ./tests/test_package_connecteurs.ps1 -PackagePath $paquetComplet[0].FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_package_connecteurs.ps1 -PackagePath $paquetComplet[0].FullName
          if ($LASTEXITCODE) { throw 'Packaged connector checks failed under Windows PowerShell 5.1.' }
          $fichiers | Copy-Item -Destination dist
          Copy-Item get.ps1 dist  # the installer too, for running it from a file (checked and attested like the packages)
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  dev:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pironjulien/NexusSystem/.github/workflows/product-dev-release.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusKeypad
      version: ${{ needs.build.outputs.version }}

  promote:
    # Right after the push that built a new version (same files), or by hand ("Run workflow").
    needs: dev
    if: always() && (needs.dev.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    uses: pironjulien/NexusSystem/.github/workflows/product-promote.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusKeypad
      promote: ${{ inputs.promote || needs.dev.outputs.tag }}
