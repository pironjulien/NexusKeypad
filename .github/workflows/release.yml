# Release: on a vX.Y.Z tag, builds the three Logi Marketplace editions and the complete NexusKeypad edition installed by
# get.ps1 (.lplug4, checked by the official Logi Plugin Tool), attests their build provenance (verify with `gh attestation verify <file> --repo pironjulien/NexusKeypad`),
# and publishes them with SHA256SUMS.txt and that provenance (NexusKeypad-X.Y.Z.intoto.jsonl, the Sigstore bundle, for
# `gh attestation verify <file> --bundle`) as the "NexusKeypad X.Y.Z" GitHub release, as a draft: the maintainer signs
# SHA256SUMS.txt offline (outils/signer_release.ps1, key never on GitHub), then publishes it. The complete edition's
# automatic update refuses a release without a valid SHA256SUMS.txt.sig.
# Actions pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Packages
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dotnet tool install -g LogiPluginTool --version 6.4.2.3599
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = $env:TAG.TrimStart('v')
          foreach ($e in 'Marketplace', 'Poste', 'Complete', 'Nexus') { ./outils/paquet_marketplace.ps1 -Edition $e }
          New-Item -ItemType Directory dist | Out-Null
          $suffixe = $version -replace '\.', '_'
          $fichiers = @(Get-ChildItem "$HOME\.nexus\build\nexuskeypad\marketplace" -File -Filter "*_$suffixe.lplug4")
          if ($fichiers.Count -ne 4) { throw "Expected 4 packages at version $version, got $($fichiers.Count)." }
          $paquetComplet = @($fichiers | Where-Object { $_.Name -eq "NexusKeypad_$suffixe.lplug4" })
          if ($paquetComplet.Count -ne 1) { throw 'Complete NexusKeypad package is absent.' }
          ./tests/test_package_connecteurs.ps1 -PackagePath $paquetComplet[0].FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/test_package_connecteurs.ps1 -PackagePath $paquetComplet[0].FullName
          if ($LASTEXITCODE) { throw 'Packaged connector checks failed under Windows PowerShell 5.1.' }
          $fichiers | Copy-Item -Destination dist
          Copy-Item get.ps1 dist  # the installer too, for running it from a file (checked and attested like the packages)
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      - name: Provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: Copy-Item $env:BUNDLE "dist/NexusKeypad-$($env:TAG.TrimStart('v')).intoto.jsonl"
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $lignes = Get-Content CHANGELOG.md
          $debut = [Array]::FindIndex($lignes, [Predicate[string]] { param($l) $l -like "## ``[$version``]*" })
          if ($debut -lt 0) { throw "CHANGELOG.md has no [$version] section." }
          $fin = [Array]::FindIndex($lignes, $debut + 1, [Predicate[string]] { param($l) $l -like '## *' })
          if ($fin -lt 0) { $fin = $lignes.Count }
          $lignes[($debut + 1)..($fin - 1)] | Set-Content notes.md -Encoding utf8NoBOM
          gh release create $env:TAG (Get-ChildItem dist -File).FullName --title "NexusKeypad $version" --notes-file notes.md --verify-tag --draft
